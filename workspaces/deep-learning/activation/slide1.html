<div class="slide-container">
<div class="slide sc" data-index="1">
    <div class="section-label" style="color:var(--accent)">01 / 核心概念</div>
    <div class="big">什么是激活函数？为什么需要它？</div>
    <p class="desc fi">
      激活函数是神经网络中每个神经元的"开关"——它接收输入的加权求和，经过一个<span class="hl">非线性函数</span>变换后输出。
      没有它，无论网络多少层，最终都只是一个线性变换。
    </p>
    <div class="row fi">
      <div class="col-narrow">
        <div class="card">
          <div class="card-top" style="background:var(--accent)"></div>
          <h3>神经元的运作</h3>
          <p style="margin-bottom:12px">输入 → 加权求和 → <span class="hl">激活函数</span> → 输出</p>
          <div style="font-family:'JetBrains Mono'; font-size:14px; line-height:2; color:var(--accent)">
            z = w₁x₁ + w₂x₂ + b<br>
            <span style="color:var(--accent-2); font-weight:700">a = σ(z)</span>
          </div>
        </div>
        <div class="card" style="margin-top:14px">
          <div class="card-top" style="background:var(--accent-2)"></div>
          <h3>直觉理解</h3>
          <p>就像大脑神经元：只有当输入信号足够强（超过某个阈值）时，神经元才会"激活"并向下传递信号。</p>
        </div>
      </div>
      <div class="col-wide">
        <div class="card" style="height:100%">
          <div class="card-top" style="background:var(--accent-3)"></div>
          <h3>为什么不能没有激活函数？</h3>
          <svg viewBox="0 0 460 240" fill="none" style="width:100%; margin-top:12px">
            <!-- Without activation -->
            <text x="115" y="20" fill="#ff3cac" font-size="12" font-weight="700" text-anchor="middle" font-family="JetBrains Mono">无激活函数</text>
            <rect x="20" y="32" width="80" height="40" rx="4" fill="#191922" stroke="#5e6178" stroke-width="1.5"/>
            <text x="60" y="56" fill="#eaedf7" font-size="11" text-anchor="middle" font-family="JetBrains Mono">Layer 1</text>
            <line x1="100" y1="52" x2="130" y2="52" stroke="#5e6178" stroke-width="1.5"/>
            <polygon points="128,48 138,52 128,56" fill="#5e6178"/>
            <text x="115" y="68" fill="#5e6178" font-size="9" text-anchor="middle" font-family="JetBrains Mono">W₁x</text>
            <rect x="140" y="32" width="80" height="40" rx="4" fill="#191922" stroke="#5e6178" stroke-width="1.5"/>
            <text x="180" y="56" fill="#eaedf7" font-size="11" text-anchor="middle" font-family="JetBrains Mono">Layer 2</text>
            <line x1="220" y1="52" x2="245" y2="52" stroke="#5e6178" stroke-width="1.5"/>
            <text x="232" y="44" fill="#ff3cac" font-size="18" text-anchor="middle" font-weight="700">=</text>
            <rect x="260" y="32" width="80" height="40" rx="4" fill="rgba(255,60,172,0.08)" stroke="#ff3cac" stroke-width="1.5"/>
            <text x="300" y="56" fill="#ff3cac" font-size="11" text-anchor="middle" font-family="JetBrains Mono">W₂W₁x</text>
            <text x="350" y="56" fill="#5e6178" font-size="10" font-family="Noto Sans SC">→ 仍然是线性变换</text>

            <!-- With activation -->
            <text x="115" y="120" fill="#36f9a0" font-size="12" font-weight="700" text-anchor="middle" font-family="JetBrains Mono">有激活函数</text>
            <rect x="20" y="132" width="80" height="40" rx="4" fill="#191922" stroke="#5e6178" stroke-width="1.5"/>
            <text x="60" y="156" fill="#eaedf7" font-size="11" text-anchor="middle" font-family="JetBrains Mono">Layer 1</text>
            <line x1="100" y1="152" x2="118" y2="152" stroke="#5e6178" stroke-width="1.5"/>
            <polygon points="116,148 126,152 116,156" fill="#5e6178"/>
            <rect x="128" y="136" width="46" height="32" rx="4" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="1.5"/>
            <text x="151" y="156" fill="#00d4ff" font-size="11" text-anchor="middle" font-family="JetBrains Mono">σ(·)</text>
            <line x1="174" y1="152" x2="192" y2="152" stroke="#5e6178" stroke-width="1.5"/>
            <polygon points="190,148 200,152 190,156" fill="#5e6178"/>
            <rect x="202" y="132" width="80" height="40" rx="4" fill="#191922" stroke="#5e6178" stroke-width="1.5"/>
            <text x="242" y="156" fill="#eaedf7" font-size="11" text-anchor="middle" font-family="JetBrains Mono">Layer 2</text>
            <line x1="282" y1="152" x2="305" y2="152" stroke="#5e6178" stroke-width="1.5"/>
            <text x="293" y="144" fill="#36f9a0" font-size="18" text-anchor="middle" font-weight="700">≠</text>
            <rect x="315" y="132" width="120" height="40" rx="4" fill="rgba(54,249,160,0.08)" stroke="#36f9a0" stroke-width="1.5"/>
            <text x="375" y="156" fill="#36f9a0" font-size="10" text-anchor="middle" font-family="JetBrains Mono">W₂·σ(W₁x+b₁)+b₂</text>
            <text x="375" y="188" fill="#36f9a0" font-size="10" text-anchor="middle" font-family="Noto Sans SC">非线性 → 能拟合任意函数</text>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
