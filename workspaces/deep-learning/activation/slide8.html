    <div class="section-label" style="color:var(--accent-3)">08 / 实践指南</div>
    <div class="big">如何选择激活函数？</div>

    <div class="row fi" style="margin-top:12px">
      <div class="col-narrow">
        <div class="card" style="border-left:3px solid var(--accent)">
          <h3 style="font-size:15px">CNN 图像任务</h3>
          <p><span class="hl">ReLU</span> 仍然是安全的默认选择。<br>追求更好效果时试 <span class="hl-pink">Swish</span>。</p>
        </div>
        <div class="card" style="border-left:3px solid var(--accent-2)">
          <h3 style="font-size:15px">Transformer / NLP</h3>
          <p><span class="hl-pink">GELU</span> 是标准选择（BERT、GPT 系列均使用）。</p>
        </div>
        <div class="card" style="border-left:3px solid var(--accent-3)">
          <h3 style="font-size:15px">输出层</h3>
          <p>
            二分类 → <span class="hl-yellow">Sigmoid</span><br>
            多分类 → <span class="hl-green">Softmax</span><br>
            回归 → 无激活 / 线性
          </p>
        </div>
        <div class="card" style="border-left:3px solid var(--orange)">
          <h3 style="font-size:15px">遇到 Dead ReLU</h3>
          <p>换用 <span class="hl-orange">Leaky ReLU</span> 或 <span class="hl-purple">ELU</span>，或降低学习率。</p>
        </div>
      </div>

      <div class="col-wide">

            <line x1="130" y1="308" x2="60" y2="308" stroke="#5e6178" stroke-width="1"/>
