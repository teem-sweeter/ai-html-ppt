        <div class="card" style="border-top:3px solid var(--accent)">

          <div style="font-family:'JetBrains Mono'; font-size:14px; color:var(--accent); margin-bottom:12px; line-height:1.8">
            GELU(x) = x · Φ(x)
          </div>
          <p style="margin-bottom:12px">
            其中 Φ(x) 是标准正态分布的累积分布函数。
            <span class="hl">直觉</span>：输入越大，被保留的概率越高。
          </p>
          <div style="font-size:13px; color:var(--text-muted); line-height:1.8">
            <span style="color:var(--accent)">使用场景</span>：BERT、GPT、ViT 等 Transformer 架构的标配
          </div>
        </div>

        <div class="card" style="margin-top:14px; border-top:3px solid var(--accent-2)">
          <h3 style="color:var(--accent-2); margin-bottom:12px">Swish / SiLU</h3>
          <div style="font-family:'JetBrains Mono'; font-size:14px; color:var(--accent-2); margin-bottom:12px; line-height:1.8">
            Swish(x) = x · σ(x)
          </div>
          <p style="margin-bottom:12px">
            其中 σ 是 Sigmoid 函数。<span class="hl-pink">自门控机制</span>：输入本身决定激活程度。
          </div>
          <div style="font-size:13px; color:var(--text-muted); line-height:1.8">
