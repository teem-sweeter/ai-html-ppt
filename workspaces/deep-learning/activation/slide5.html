<div class="slide-container">
<div class="slide sc" data-index="5">
    <div class="section-label" style="color:var(--purple)">05 / ReLU 变体</div>
    <div class="big">解决 Dead ReLU 的<span class="hl-purple">三种方案</span></div>

    <div class="row fi" style="margin-top:8px">
      <div class="col" style="flex:1.1">
        <div class="chart-wrap" style="height:100%">
          <svg viewBox="0 0 440 320" fill="none" style="width:100%">
            <!-- Grid -->
            <line x1="40" y1="200" x2="420" y2="200" stroke="#252536" stroke-width="1"/>
            <line x1="220" y1="20" x2="220" y2="300" stroke="#252536" stroke-width="1"/>
            <text x="425" y="204" fill="#5e6178" font-size="9" font-family="JetBrains Mono">0</text>
            <!-- ReLU (reference, dimmer) -->
            <path d="M40 200 L220 200 L400 40" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="4"/>
            <!-- Leaky ReLU -->
            <path d="M40 248 Q100 230 160 216 L220 200 L400 40" stroke="#a855f7" stroke-width="2.5" fill="none"/>
            <!-- Labels -->
            <text x="100" y="240" fill="#a855f7" font-size="11" font-weight="700" font-family="JetBrains Mono">Leaky ReLU</text>
            <text x="120" y="190" fill="#00d4ff" font-size="9" font-family="JetBrains Mono" opacity="0.5">ReLU (参考)</text>
            <text x="320" y="60" fill="#5e6178" font-size="9" font-family="JetBrains Mono">y = x (x > 0)</text>
            <text x="100" y="264" fill="#a855f7" font-size="9" font-family="JetBrains Mono">y = 0.01x (x < 0)</text>
            <!-- Parameter annotation -->
            <rect x="270" y="260" width="140" height="40" rx="4" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
            <text x="340" y="278" fill="#a855f7" font-size="10" text-anchor="middle" font-family="JetBrains Mono">负区间保留</text>
            <text x="340" y="292" fill="#a855f7" font-size="10" text-anchor="middle" font-family="JetBrains Mono">小梯度 → 不会死亡</text>
          </svg>
        </div>
      </div>

      <div class="col" style="flex:0.9">
        <div class="var-grid" style="grid-template-columns:1fr; gap:12px">
          <div class="var-card">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px">
              <div style="width:10px; height:10px; border-radius:50%; background:var(--purple)"></div>
              <h3 style="margin:0">Leaky ReLU</h3>
            </div>
            <div class="var-sig" style="color:var(--purple)">
              f(x) = max(<span style="color:var(--accent-2)">α</span>x, x)，α = 0.01
            </div>
            <p>负区间给一个很小的斜率（通常 0.01），保证梯度不为零，神经元不会"死亡"。</p>
          </div>
          <div class="var-card">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px">
              <div style="width:10px; height:10px; border-radius:50%; background:var(--accent-3)"></div>
              <h3 style="margin:0">PReLU</h3>
            </div>
            <div class="var-sig" style="color:var(--accent-3)">
              f(x) = max(<span style="color:var(--accent-2)">α</span>x, x)，α 可学习
            </div>
            <p>与 Leaky ReLU 类似，但 α 是<span class="hl-green">通过训练自动学习</span>的参数，而非固定值。</p>
          </div>
          <div class="var-card">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px">
              <div style="width:10px; height:10px; border-radius:50%; background:var(--orange)"></div>
              <h3 style="margin:0">ELU</h3>
            </div>
            <div class="var-sig" style="color:var(--orange)">
              f(x) = x (x > 0)，α(e<sup>x</sup> − 1) (x ≤ 0)
            </div>
            <p>负区间用指数函数平滑过渡，输出均值更接近零，有助于收敛。但计算稍慢。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
