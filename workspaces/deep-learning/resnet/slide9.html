    <div class="section-label">09 / 总结</div>
    <div class="big-text" style="font-size:clamp(24px,3.5vw,44px)">ResNet 带来了什么？</div>

    <div class="summary-grid fade-item" style="margin-top:28px">
      <div class="summary-card">
        <div class="summary-icon">F</div>
        <div>
          <h3>残差学习</h3>
          <p>学习 F(x) = H(x) − x，而非直接学 H(x)。让恒等映射变得容易学习，解决退化问题。</p>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon">+</div>
        <div>
          <h3>跳跃连接</h3>
          <p>shortcut connection 直接传递输入，梯度有了"高速公路"，训练数百层成为可能。</p>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon">D</div>
        <div>
          <h3>突破深度极限</h3>
          <p>从此前约 20 层的上限，一举推进到 152 层甚至更深，同时训练误差持续下降。</p>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon">★</div>
        <div>
          <h3>深远影响</h3>
          <p>残差连接已成为现代网络的标配组件，影响了 Transformer、DenseNet 等后续架构的设计哲学。</p>
        </div>
      </div>
    </div>
