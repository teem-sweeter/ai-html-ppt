<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --accent: #00e5ff;
    --accent-2: #7c4dff;
    --accent-3: #ff6d00;
    --text-primary: #eef0f6;
    --text-muted: #6b6d7b;
    --green: #00e676;
    --grid-cell: #1e1e2e;
    --grid-border: #2a2a3d;
    --highlight: #ffab00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  .presentation {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 80px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(30px);
    transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0s 0.6s;
  }

  .slide.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ===== 标题页 ===== */
  .slide-title {
    background: radial-gradient(ellipse at 30% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(124, 77, 255, 0.06) 0%, transparent 50%),
                var(--bg);
    text-align: center;
  }

  .slide-title .tag {
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(0, 229, 255, 0.3);
    padding: 6px 18px;
    border-radius: 2px;
    margin-bottom: 40px;
  }

  .slide-title h1 {
    font-size: clamp(48px, 7vw, 96px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-align: center;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #ffffff 0%, #b0b8d1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .slide-title h1 span {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .slide-title .subtitle {
    font-size: clamp(16px, 2vw, 22px);
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  .slide-title .hint {
    position: absolute;
    bottom: 40px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.5;
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* ===== 内容页 ===== */
  .slide-content {
    align-items: flex-start;
    background: var(--bg);
  }

  .section-tag {
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--accent-2);
    margin-bottom: 16px;
    opacity: 0.8;
  }

  h2 {
    font-size: clamp(32px, 4.5vw, 56px);
    font-weight: 900;
    margin-bottom: 48px;
    line-height: 1.2;
  }

  /* ===== 卡片网格 ===== */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    width: 100%;
    max-width: 1100px;
  }

  .card-grid.cols-3 {
    grid-template-columns: repeat(3, 1fr);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--grid-border);
    border-radius: 6px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
  }

  .slide.active .card {
    animation: fadeUp 0.5s ease forwards;
  }

  .slide.active .card:nth-child(2) { animation-delay: 0.1s; }
  .slide.active .card:nth-child(3) { animation-delay: 0.2s; }
  .slide.active .card:nth-child(4) { animation-delay: 0.3s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .card:nth-child(1)::before { background: var(--accent); }
  .card:nth-child(2)::before { background: var(--accent-2); }
  .card:nth-child(3)::before { background: var(--green); }
  .card:nth-child(4)::before { background: var(--accent-3); }

  .card h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-primary);
  }

  .card p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  /* ===== 公式框 ===== */
  .formula-box {
    background: var(--surface);
    border: 1px solid var(--grid-border);
    border-radius: 6px;
    padding: 32px;
    text-align: center;
    max-width: 600px;
    width: 100%;
  }

  .formula-main {
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .formula-note {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  /* ===== 代码块 ===== */
  .code-block {
    background: var(--surface-2);
    border: 1px solid var(--grid-border);
    border-radius: 6px;
    padding: 20px 24px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 14px;
    line-height: 1.8;
    color: var(--accent);
    overflow-x: auto;
  }

  /* ===== 总结页 ===== */
  .slide-summary {
    background: var(--bg);
    align-items: flex-start;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    width: 100%;
    max-width: 1000px;
  }

  .summary-item {
    display: flex;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--grid-border);
    border-radius: 6px;
    padding: 24px;
    opacity: 0;
    transform: translateY(20px);
  }

  .slide.active .summary-item {
    animation: fadeUp 0.5s ease forwards;
  }

  .slide.active .summary-item:nth-child(2) { animation-delay: 0.1s; }
  .slide.active .summary-item:nth-child(3) { animation-delay: 0.2s; }
  .slide.active .summary-item:nth-child(4) { animation-delay: 0.3s; }

  .summary-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    background: rgba(0, 229, 255, 0.1);
    color: var(--accent);
  }

  .summary-item h3 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .summary-item p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  /* ===== 导航栏 ===== */
  .nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.04);
    z-index: 100;
  }

  .nav-progress {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--grid-border);
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .nav-dot.active {
    background: var(--accent);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    width: 24px;
    border-radius: 4px;
  }

  .nav-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-btn {
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--grid-border);
    color: var(--text-muted);
    padding: 6px 16px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .nav-btn:disabled {
    opacity: 0.2;
    cursor: default;
  }

  .nav-btn:disabled:hover {
    border-color: var(--grid-border);
    color: var(--text-muted);
  }

  .nav-page {
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 12px;
  }

  @media (max-width: 768px) {
    .slide { padding: 30px 24px; }
    .card-grid { grid-template-columns: 1fr; }
    .card-grid.cols-3 { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="presentation" id="presentation">

  <!-- SLIDE 0: 标题页 -->
  <div class="slide slide-title active" data-index="0">
    <div class="tag">{{TAG}}</div>
    <h1>{{MAIN_TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <div class="hint">按 → 或点击底部导航切换页面</div>
  </div>

  <!-- SLIDE 1: 内容页示例 -->
  <div class="slide slide-content" data-index="1">
    <div class="section-tag">01 / 章节标题</div>
    <h2>页面标题</h2>
    <div class="card-grid">
      <div class="card">
        <h3>要点一</h3>
        <p>描述内容...</p>
      </div>
      <div class="card">
        <h3>要点二</h3>
        <p>描述内容...</p>
      </div>
      <div class="card">
        <h3>要点三</h3>
        <p>描述内容...</p>
      </div>
      <div class="card">
        <h3>要点四</h3>
        <p>描述内容...</p>
      </div>
    </div>
  </div>

  <!-- SLIDE 2: 公式页示例 -->
  <div class="slide slide-content" data-index="2">
    <div class="section-tag">02 / 核心公式</div>
    <h2>公式标题</h2>
    <div class="formula-box">
      <div class="formula-main">f(x) = ...</div>
      <div class="formula-note">公式说明</div>
    </div>
  </div>

  <!-- SLIDE 3: 总结页 -->
  <div class="slide slide-summary" data-index="3">
    <div class="section-tag">总结</div>
    <h2>核心要点</h2>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-icon">1</div>
        <div>
          <h3>要点一</h3>
          <p>描述内容...</p>
        </div>
      </div>
      <div class="summary-item">
        <div class="summary-icon">2</div>
        <div>
          <h3>要点二</h3>
          <p>描述内容...</p>
        </div>
      </div>
      <div class="summary-item">
        <div class="summary-icon">3</div>
        <div>
          <h3>要点三</h3>
          <p>描述内容...</p>
        </div>
      </div>
      <div class="summary-item">
        <div class="summary-icon">4</div>
        <div>
          <h3>要点四</h3>
          <p>描述内容...</p>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 导航栏 -->
<div class="nav-bar">
  <div class="nav-progress" id="navProgress"></div>
  <div class="nav-controls">
    <button class="nav-btn" id="btnPrev" onclick="navigate(-1)">← Prev</button>
    <span class="nav-page" id="pageIndicator">1 / 4</span>
    <button class="nav-btn" id="btnNext" onclick="navigate(1)">Next →</button>
  </div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const totalSlides = slides.length;
  let currentSlide = 0;

  // 构建导航点
  const navProgress = document.getElementById('navProgress');
  for (let i = 0; i < totalSlides; i++) {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    navProgress.appendChild(dot);
  }

  function goTo(index) {
    if (index < 0 || index >= totalSlides || index === currentSlide) return;
    slides[currentSlide].classList.remove('active');
    currentSlide = index;
    slides[currentSlide].classList.add('active');
    updateNav();
  }

  function navigate(dir) {
    goTo(currentSlide + dir);
  }

  function updateNav() {
    document.querySelectorAll('.nav-dot').forEach((dot, i) => {
      dot.className = 'nav-dot' + (i === currentSlide ? ' active' : '');
    });
    document.getElementById('pageIndicator').textContent = (currentSlide + 1) + ' / ' + totalSlides;
    document.getElementById('btnPrev').disabled = currentSlide === 0;
    document.getElementById('btnNext').disabled = currentSlide === totalSlides - 1;
  }

  // 键盘导航
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      navigate(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      navigate(-1);
    }
  });

  // 触摸滑动支持
  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });
  document.addEventListener('touchend', (e) => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 60) {
      if (diff > 0) navigate(1);
      else navigate(-1);
    }
  });

  updateNav();
</script>

</body>
</html>
